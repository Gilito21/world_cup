<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Ink-green tile background (matches the .fav from logo-03.html) -->
  <rect width="64" height="64" fill="#0E2A18"/>
  <!-- Soccer-ball mark, centered. The cream outer ring replicates the
       box-shadow:inset 0 0 0 2px var(--cream) on .fav-ball, and the
       alternating ink/white concentric rings replicate the
       radial-gradient(#fff 0 26%, ink 27-31%, #fff 32-62%, ink 63-67%, #fff 68-100%). -->
  <g>
    <!-- 2px cream rim around the ball -->
    <circle cx="32" cy="32" r="18" fill="#F4ECD6"/>
    <!-- white outer ball -->
    <circle cx="32" cy="32" r="16" fill="#FFFFFF"/>
    <!-- 63–67% ring → ink -->
    <circle cx="32" cy="32" r="11.7" fill="#0E2A18"/>
    <!-- 32–62% band → white -->
    <circle cx="32" cy="32" r="11.0" fill="#FFFFFF"/>
    <!-- 27–31% ring → ink -->
    <circle cx="32" cy="32" r="5.6" fill="#0E2A18"/>
    <!-- 0–26% core → white -->
    <circle cx="32" cy="32" r="4.95" fill="#FFFFFF"/>
  </g>
</svg>
