services:
  # Web estática - la app React
  - type: web
    name: porra-mundial-2026
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Cron: actualizar resultados cada 5 minutos durante el Mundial
  - type: cron
    name: actualizar-resultados-mundial
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: node scripts/update-results.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FOOTBALL_API_KEY
        sync: false

  # Cron: recordatorios por email cada 30 minutos
  - type: cron
    name: recordatorios-pronosticos
    runtime: node
    schedule: "*/30 * * * *"
    buildCommand: npm install
    startCommand: node scripts/send-reminders.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FROM_EMAIL
        sync: false
