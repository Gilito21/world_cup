name: Actualizar resultados

on:
  schedule:
    # Cada hora: los resultados en tiempo real los gestiona la edge function
    # update-results de Supabase (pg_cron cada 5 min). Este workflow corre
    # de backup y para recalcular advance_points (bonus de avance de ronda),
    # que no están en la edge function.
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/update-results.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
