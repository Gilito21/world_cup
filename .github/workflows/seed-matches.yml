name: Seed partidos WC2026

on:
  # Diario a las 05:00 UTC: trae equipos/horas reales de la siguiente ronda en
  # cuanto football-data los publica y reconcilia el cuadro (bracket_match_id +
  # remapeo de esa ronda) automáticamente. Idempotente: lo ya asignado no se
  # re-toca. Hora de baja actividad (pocos partidos en juego).
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/seed-matches.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
