name: Resumen diario Mundial

# Lanzado cada día a las 06:05 UTC (= 08:05 hora peninsular española
# durante el Mundial 2026, que cae en CEST = UTC+2). Usamos el minuto :05
# en vez de :00 a propósito: los crons al filo de la hora sufren más
# retraso por congestión en GitHub Actions. Aun así Actions no garantiza
# la hora exacta, pero el contenido (resumen de la jornada) no es
# tiempo-crítico. El script comprueba la ventana del torneo internamente
# y hace early-return si no estamos dentro, así que el cron puede
# quedarse activo todo el año sin gastar llamadas a Brevo. Idempotente
# vía tabla daily_digests (PK user_id+digest_date): un solo envío por
# usuario y día, aunque el cron y un disparo manual coincidan.
on:
  schedule:
    - cron: '5 6 * * *'
  workflow_dispatch:

# Least privilege: este workflow no escribe nada en el repo.
permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    # Si Brevo o Supabase se quedan colgados el job no debería ocupar el
    # runner las 6h por defecto. 15 min es de sobra para enviar a unos
    # cientos de usuarios.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: node scripts/send-daily-digest.js
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_API_KEY:             ${{ secrets.BREVO_API_KEY }}
          APP_URL:                   ${{ secrets.APP_URL }}
          FROM_EMAIL:                ${{ secrets.FROM_EMAIL }}
          FROM_NAME:                 ${{ secrets.FROM_NAME }}
